# Necronomicon antagonist actions. Icons are placeholders reused from existing assets.

- type: entity
  parent: ActionIntrinsicStore
  id: ActionNecroShop
  name: Skill Store
  description: Spend Soul Power on possessions, powers, a physical form and Demonspawn.

- type: entity
  parent: BaseAction
  id: ActionNecroManifestBook
  name: Manifest Necronomicon
  description: Bring the book into the physical world where you stand. Takes a few seconds. Free.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    checkCanInteract: false
    priority: 10
  - type: Sprite
    layers:
    - sprite: Objects/Misc/books.rsi
      state: cover_base
      color: "#5a3b2e"
  - type: InstantAction
    event: !type:NecroManifestBookActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroDemanifestBook
  name: Demanifest Necronomicon
  description: Pull the book back into the ether. Fails while a living, unpossessed person carries it. Free.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    checkCanInteract: false
    priority: 9
  - type: Sprite
    layers:
    - texture: Interface/Actions/defile.png
  - type: InstantAction
    event: !type:NecroDemanifestBookActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroJoinUs
  name: JOIN US
  description: With the book in the world, whisper to someone within 12 tiles of you, preparing them for possession.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
    priority: 8
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: harvesting
  - type: TargetAction
    checkCanAccess: false
    range: 20
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroJoinUsActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroPossess
  name: Possess
  description: Possess a prepared victim within 12 tiles of you and 20 tiles of the manifested book. They can run during the channel. Consumes one possession charge.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
    priority: 7
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: active
  - type: TargetAction
    checkCanAccess: false
    range: 14
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroPossessActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroWhisper
  name: Voices in the Woods
  description: "The Evil Dead: the voices that called Cheryl out into the trees. Whisper terrors into someone's mind. Generates Fear. Costs 2 SP."
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: icon
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroWhisperActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroDarkPresence
  name: The Laughing Cabin
  description: "Evil Dead II: the room comes alive. Lights flicker, machines misbehave and the furniture laughs. Generates Fear. Costs 4 SP."
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/overloadlight.png
  - type: InstantAction
    event: !type:NecroDarkPresenceActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroManifestForm
  name: Take Flesh
  description: Become a corporeal, combat-capable demon in your chosen form. Costs 5 SP. Your body can be destroyed; the book cannot be harmed through it.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Mobs/Demons/abomination.rsi
      state: abomination
  - type: InstantAction
    event: !type:NecroManifestFormActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroReturnToEther
  name: Return to the Ether
  description: Abandon this body and become incorporeal again.
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: idle
  - type: InstantAction
    event: !type:NecroReturnToEtherActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroUnholyRoar
  name: Kandarian Bellow
  description: Roar with the voice of the book. Lights die, the room shakes, and anyone close without a mindshield is thrown to the floor.
  components:
  - type: Action
    useDelay: 40
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling2.rsi
      state: screech
  - type: InstantAction
    event: !type:NecroUnholyRoarActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroPoltergeist
  name: Possessed Objects
  description: Every loose object around you is torn into the air and hurled at the nearest living person.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/malfunction.png
  - type: InstantAction
    event: !type:NecroPoltergeistActionEvent

# --- Deadites ---

- type: entity
  parent: BaseAction
  id: ActionDeaditeReveal
  name: Reveal True Form
  description: Drop the disguise. Your skin goes pale, your eyes go white, and everyone nearby will know. Generates a burst of Soul Power.
  components:
  - type: Action
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: active
  - type: InstantAction
    event: !type:DeaditeRevealActionEvent

- type: entity
  parent: BaseAction
  id: ActionDeaditeBite
  name: Deadite Bite
  description: Bite a crew member, leaving them open to possession. Mindshields repel the curse.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - texture: Interface/Actions/zombie-turn.png
  - type: TargetAction
    range: 2.5 # the real reach (1.5, or 2.5 with Stalker I) is checked server-side
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:DeaditeBiteActionEvent

- type: entity
  parent: BaseAction
  id: ActionDeaditeReadPassage
  name: Read the Passage of the Dead
  description: While revealed, with the manifested book beside you, read the passage that melts away a victim's mindshield.
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Objects/Misc/books.rsi
      state: icon_text
  - type: TargetAction
    range: 2
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:DeaditeReadPassageActionEvent

- type: entity
  parent: BaseAction
  id: ActionDeaditeTaunt
  name: Taunt
  description: Let them hear the voice of the dead. "Join us!"
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/scream.png
  - type: InstantAction
    event: !type:DeaditeTauntActionEvent

# --- Deadite progression tree ---

- type: entity
  parent: BaseAction
  id: ActionDeaditeScream
  name: Unholy Shriek
  description: Shriek with the voice of the thing inside you. Everyone nearby is terrified. With Deafening Wail, those close by are thrown off their feet. You must be revealed.
  components:
  - type: Action
    useDelay: 45
    itemIconStyle: BigAction
    checkCanInteract: false
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling2.rsi
      state: screech
  - type: InstantAction
    event: !type:DeaditeScreamActionEvent

- type: entity
  parent: BaseAction
  id: ActionDeaditeConceal
  name: Wear Their Face
  description: Pull the stolen face back over your own. You look and sound like your host again, and can reveal yourself later.
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling2.rsi
      state: flesh_clothing
  - type: InstantAction
    event: !type:DeaditeConcealActionEvent

# --- Demonic possession (harmless puppeting) ---

- type: entity
  parent: BaseAction
  id: ActionNecroPuppet
  name: Possessed Puppet
  description: Seize anyone nearby for 45 seconds. They collapse, helpless, and everything you say comes out of their mouth. Harmless. Costs 3 SP. Use it on your host again to let go.
  components:
  - type: Action
    useDelay: 3 # the real cooldown is enforced in code so the host can always be released
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: stunned
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroPuppetActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroPuppetAnnounce
  name: Speak to the Station
  description: While possessing someone, your next sentence becomes a station announcement signed with their name. Costs 3 SP when spoken. Use again to cancel.
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/shop.png
  - type: InstantAction
    event: !type:NecroPuppetAnnounceActionEvent


# --- Film powers (bought in the Skill Store) ---

- type: entity
  parent: BaseAction
  id: ActionNecroRush
  name: The Force
  description: "The Evil Dead: tear across the station in a straight line, up to 14 tiles, faster than anything alive. Doors bang, lights die, and anyone in your path is knocked flat. Costs 4 SP."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Mobs/Ghosts/revenant.rsi
      state: active
  - type: TargetAction
    checkCanAccess: false
    range: 14
  - type: WorldTargetAction
    event: !type:NecroRushActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroGraspingRoots
  name: The Trees
  description: "The Evil Dead: roots and branches burst up through the floor and hold someone fast for a few seconds. Costs 3 SP."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling2.rsi
      state: fleshtomb
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroGraspingRootsActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroPossessedHand
  name: The Hand
  description: "Evil Dead II: their own hand turns on them. It drops everything it holds and beats them. Mindshields stop it. Costs 3 SP."
  components:
  - type: Action
    useDelay: 35
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling.rsi
      state: armblade
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroPossessedHandActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroDeceit
  name: Baal's Deceit
  description: "Ash vs Evil Dead: show someone a vision of a nearby friend's eyes flashing milky white. True or false, they won't know. Mindshields stop it. Costs 2 SP."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling2.rsi
      state: mimicry
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroDeceitActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroDeadByDawn
  name: Dead by Dawn
  description: "Evil Dead II: the whole station hears it. Every one of your Deadites stands back up, healed and faster for a minute. Once every ten minutes."
  components:
  - type: Action
    useDelay: 600
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/scream.png
  - type: InstantAction
    event: !type:NecroDeadByDawnActionEvent

- type: entity
  parent: BaseAction
  id: ActionDeaditeSwallowSoul
  name: Swallow Their Soul
  description: "\"I'll swallow your soul!\" Feed on someone who is down and dying. Heals you and feeds the book."
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
  - type: Sprite
    layers:
    - sprite: Interface/Actions/changeling.rsi
      state: devour
  - type: TargetAction
    range: 1.5
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:DeaditeSwallowSoulActionEvent

- type: entity
  parent: BaseAction
  id: ActionNecroRiseAgain
  name: From the Grave
  description: "The Evil Dead: they would not stay buried. Raise a corpse as a revealed Deadite. If nobody's in it, a ghost can take it. Costs 8 SP."
  components:
  - type: Action
    useDelay: 60
    itemIconStyle: BigAction
    checkCanInteract: false
    checkConsciousness: false
  - type: Sprite
    layers:
    - texture: Interface/Actions/zombie-turn.png
  - type: TargetAction
    checkCanAccess: false
    range: 12
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidProfile
    event: !type:NecroRiseAgainActionEvent
