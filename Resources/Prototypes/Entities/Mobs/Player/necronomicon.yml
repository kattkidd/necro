# --- Demonspawn ---------------------------------------------------------------------------------
- type: entity
  parent: MobBaseAncestor
  id: MobDemonspawn
  name: demonspawn
  description: A small, grey, childlike thing with long claws and a wide, wet grin.
  components:
  - type: Sprite
    drawdepth: Mobs
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: demonspawn
      sprite: Mobs/Demons/demonspawn.rsi
    - map: [ "jumpsuit" ]
    - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "ears" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: DamageStateVisuals
    states:
      Alive:
        Base: demonspawn
      Critical:
        Base: demonspawn
      Dead:
        Base: demonspawn
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Speech
    speechSounds: Demonspawn
    speechVerb: Monkey
  - type: TypingIndicator
    proto: necro
  - type: MonkeyAccent
  - type: Demonspawn
    maturationTime: 600 # seconds until it grows into MobDemonspawnAdult
  - type: KandarianEntity
  - type: KandarianRegen
    reviveDelay: 45
    passiveHeal: 0.15
  - type: MobState
    allowedStates:
    - Alive
    - Critical
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      100000: Dead # cannot die from ordinary damage; regenerates from critical
  - type: MovementSpeedModifier
    baseWalkSpeed: 3.5
    baseSprintSpeed: 5
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 7
  - type: IntrinsicRadioTransmitter
    channels:
    - Sumerian
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Sumerian
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: HTN
    rootTask:
      task: SimpleHostileCompound
  - type: GhostRole
    makeSentient: true
    allowMovement: true
    name: ghost-role-information-demonspawn-name
    description: ghost-role-information-demonspawn-description
    rules: ghost-role-information-demonspawn-rules
    mindRoles:
    - MindRoleDemonspawn
    raffle:
      settings: short
  - type: GhostTakeoverAvailable

