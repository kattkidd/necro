# --- The Necronomicon ---------------------------------------------------------------------------
- type: entity
  parent: BookBase
  id: NecronomiconBook
  name: Necronomicon Ex-Mortis
  description: The Book of the Dead. Ancient Sumerian, written by the Dark Ones, bound in human flesh and inked in blood. A face is pressed into the cover, and it is watching you.
  components:
  - type: Sprite
    sprite: Objects/Misc/necronomicon.rsi
    layers:
    - state: icon
    # Empty layers kept so the paper/book visuals find the layers they expect.
    - sprite: Objects/Misc/books.rsi
      state: overlay_null
      map: [ "cover" ]
    - sprite: Objects/Misc/books.rsi
      state: overlay_null
      map: [ "decor" ]
    - sprite: Objects/Misc/books.rsi
      state: overlay_null
      map: [ "icon" ]
    - sprite: Objects/Misc/books.rsi
      state: overlay_null
      map: [ "overlay" ]
  - type: Appearance
  - type: Necronomicon
  # Hears whoever stands near it, so it knows whether they said the words before taking it.
  - type: ActiveListener
    range: 4
  # Written in blood in a language nobody living can read, with a long-dead archaeologist's pencilled notes.
  - type: Paper
    content: necronomicon-book-text
    editingDisabled: true
  - type: PaperVisuals
    backgroundModulate: "#b8a68a"
    defaultTextColor: "#7a0606"
  - type: Flammable
    fireSpread: false
    canResistFire: false
    alwaysCombustible: true
    canExtinguish: true
    damage:
      types:
        Heat: 0
  - type: FireVisuals
    sprite: Effects/fire.rsi
    normalState: fire
  - type: Reactive
    groups:
      Flammable: [ Touch ]
      Extinguish: [ Touch ]
  - type: ExtinguishableSetCollisionWake
  - type: Tag
    tags:
    - Book

# --- The lost pages ----------------------------------------------------------------------------
- type: entity
  parent: Paper
  id: NecroLostPages
  name: lost pages of the Necronomicon
  description: A sheaf of pages torn from the Book of the Dead, interleaved with someone's centuries-old translation notes. Two passages are circled.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
      color: "#c9ad86"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#7a0606"
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: Paper
    content: necronomicon-pages-text
    editingDisabled: true
  - type: PaperVisuals
    backgroundModulate: "#c9b28c"
    defaultTextColor: "#3a2a1a"
  - type: NecroLostPages

# --- The Kandarian dagger -----------------------------------------------------------------------
- type: entity
  parent: RitualDagger
  id: KandarianDagger
  name: Kandarian dagger
  description: An ancient Sumerian ceremonial dagger, its hilt carved with leering faces. It was found in the cellar with the book. A downed Deadite struck with it is cut apart for good, and it bites deep into demon flesh.
  components:
  - type: NecroKandarianDagger
  - type: Sprite
    sprite: Objects/Weapons/Melee/cult_dagger.rsi
    state: icon
    color: "#c8b48a"
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.5
    damage:
      types:
        Slash: 10
        Piercing: 5

# --- The old recording --------------------------------------------------------------------------
- type: entity
  parent: BaseItem
  id: NecroOldRecording
  name: antique tape recorder
  description: A reel-to-reel recorder, centuries old, the kind nobody has made in a very long time. It still plays. The tape is labelled in a careful hand. You can rewind it and play the log again.
  components:
  - type: Sprite
    sprite: Objects/Fun/clownrecorder.rsi
    state: icon
    color: "#7a6a52"
  - type: Item
    sprite: Objects/Fun/clownrecorder.rsi
    size: Small
  - type: NecroRecording

