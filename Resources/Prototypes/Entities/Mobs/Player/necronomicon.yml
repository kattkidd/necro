# Necronomicon antagonist (Evil Dead). All art and audio are placeholders reused from existing assets.

# --- The incorporeal Kandarian Demon -------------------------------------------------------------
# No Damageable, no Hands, no MeleeWeapon, ghost-layer visibility and ghost collision only:
# it cannot be harmed, cannot attack and cannot physically interact until it buys a physical form.
- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: MobKandarianDemon
  name: kandarian demon
  description: Something unseen, moving fast and low through the station.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: Ghosts
    sprite: Mobs/Ghosts/revenant.rsi
    color: "#b02020aa"
    layers:
    - state: idle
  - type: Appearance
  - type: NecroDemonVisuals
  - type: Input
    context: "ghost"
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
  - type: NoSlip
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Visibility
    layer: 2 # ghost layer: invisible to the living
  - type: MindContainer
  - type: Examiner
  - type: Speech
    speechVerb: Ghost
    speechSounds: KandarianWhisper
  - type: TypingIndicator
    proto: necro
  - type: Grammar
    attributes:
      proper: true
  - type: RandomMetadata
    nameSegments:
    - NamesKandarianFirst
    nameFormat: name-format-kandarian
  - type: NecroDemon
    rendingClawsBonus:
      types:
        Slash: 6
  - type: KandarianEntity
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: Store
    name: necro-store-title
    categories:
    - NecroAppearance
    - NecroPossession
    - NecroFear
    - NecroPowers
    - NecroManifestation
    - NecroDemonspawn
    - NecroInfiltration
    - NecroDeaditeTree
    currencyWhitelist:
    - SoulPower
  - type: ActionGrant
    actions:
    - ActionNecroShop
    - ActionNecroManifestBook
    - ActionNecroDemanifestBook
    - ActionNecroJoinUs
    - ActionNecroPossess
  - type: Tag
    tags:
    - SlowImmune
    - KnockdownImmune
    - AllowPortalTraversal

# --- Physical forms ------------------------------------------------------------------------------
# Stats are set here deliberately; they do not inherit from the creature the sprite comes from.
- type: entity
  abstract: true
  parent:
  - BaseSimpleMob
  - MobCombat
  id: BaseMobKandarianForm
  name: kandarian demon
  description: A thing that should not be. It reeks of old blood and burnt pages.
  categories: [ HideSpawnMenu ]
  components:
  - type: NecroManifestation
  - type: KandarianEntity
  - type: Input
    context: "human"
  - type: Eye
  - type: ContentEye
  - type: Examiner
  - type: Speech
    speechVerb: Ghost
    speechSounds: KandarianWhisper
  - type: TypingIndicator
    proto: necro
  - type: MindContainer
  - type: Grammar
    attributes:
      proper: true
  - type: Damageable
    damageModifierSet: HellSpawn
  - type: Injurable
    damageContainer: BiologicalMetaphysical
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Dead
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 4.5
  - type: MeleeWeapon
    attackRate: 1
    angle: 0
    animation: WeaponArcClaw
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    damage:
      types:
        Slash: 14
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 1.5
  - type: Puller
    needsHands: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 120
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: IntrinsicRadioTransmitter
    channels:
    - Sumerian
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - Sumerian
  - type: PointLight
    radius: 1.5
    energy: 1.5
    color: "#a01818"
    castShadows: false
  - type: Tag
    tags:
    - DoorBumpOpener
    - CannotSuicide

- type: entity
