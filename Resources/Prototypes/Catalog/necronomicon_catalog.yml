# Necronomicon Skill Store. All costs are in Soul Power (SP) and can be tuned here.
# Purchases are validated server-side by StoreSystem (balance, stock, prerequisites) before any effect is applied.

- type: currency
  id: SoulPower
  displayName: store-currency-display-soul-power
  canWithdraw: false

- type: storeCategory
  id: NecroAppearance
  name: store-category-necro-appearance
  priority: 0

- type: storeCategory
  id: NecroPossession
  name: store-category-necro-possession
  priority: 1

- type: storeCategory
  id: NecroFear
  name: store-category-necro-fear
  priority: 2

- type: storeCategory
  id: NecroPowers
  name: store-category-necro-powers
  priority: 3

- type: storeCategory
  id: NecroManifestation
  name: store-category-necro-manifestation
  priority: 4

- type: storeCategory
  id: NecroDemonspawn
  name: store-category-necro-demonspawn
  priority: 5

- type: storeCategory
  id: NecroInfiltration
  name: store-category-necro-infiltration
  priority: 6

# --- Appearance (free, cosmetic, changeable) ---

- type: listing
  id: NecroFormAbomination
  name: necro-catalog-form-abomination-name
  description: necro-catalog-form-desc
  icon: { sprite: /Textures/Mobs/Demons/abomination.rsi, state: abomination }
  cost:
    SoulPower: 0
  categories:
  - NecroAppearance
  productEvent: !type:NecroSelectFormEvent
    form: MobKandarianFormAbomination
    rsi: /Textures/Mobs/Demons/abomination.rsi
    state: abomination
  raiseProductEventOnUser: true

- type: listing
  id: NecroFormHellspawn
  name: necro-catalog-form-hellspawn-name
