# --- Deadite progression tree ---
# Four paths, two tiers each. Tier II needs tier I of the same path. A demon can only commit to two of the four
# paths (NecroPathLimitCondition). Every tier applies to all of the demon's Deadites, present and future.
# Effects and tuning: DeaditeSystem.Tree.cs and DeaditeComponent.

- type: listing
  id: NecroDeaditeInfiltrator1
  name: necro-catalog-infiltrator-1-name
  description: necro-catalog-infiltrator-1-desc
  icon: { sprite: /Textures/Interface/Actions/changeling2.rsi, state: mimicry }
  cost:
    SoulPower: 8
  categories:
  - NecroDeaditeTree
  conditions:
  - !type:ListingLimitedStockCondition
    stock: 1
  - !type:NecroPathLimitCondition
    lock: true
    listings: [ NecroDeaditeInfiltrator1, NecroDeaditeBrute1, NecroDeaditeStalker1, NecroDeaditeScreamer1 ]
  productEvent: !type:NecroUpgradeEvent
    upgrade: InfiltratorI
  raiseProductEventOnUser: true

