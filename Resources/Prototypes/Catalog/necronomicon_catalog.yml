    SoulPower: 0
  categories:
  - NecroAppearance
  productEvent: !type:NecroSelectFormEvent
    form: MobKandarianFormHellspawn
    rsi: /Textures/Mobs/Demons/hellspawn.rsi
    state: alive
  raiseProductEventOnUser: true

- type: listing
  id: NecroFormFlesh
  name: necro-catalog-form-flesh-name
  description: necro-catalog-form-desc
