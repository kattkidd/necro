# Kandarian Demon loadout, chosen before the round in
# Character Setup → Antags → Kandarian Demon → Loadout (next to the alias).
# Each option's preview entity carries a component that says what it means.

- type: loadoutGroup
  id: NecroDemonAppearance
  name: loadout-group-necro-appearance
  minLimit: 1
  maxLimit: 1
  loadouts:
  - NecroAppearanceAbomination
  - NecroAppearanceHellspawn
  - NecroAppearanceFlesh
  - NecroAppearanceWraith
  - NecroAppearanceLover
  - NecroAppearanceCrawler
  - NecroAppearanceApparition

- type: loadoutGroup
  id: NecroDemonAura
  name: loadout-group-necro-aura
  minLimit: 1
  maxLimit: 1
  loadouts:
  - NecroAuraCrimson
  - NecroAuraBile
  - NecroAuraVoid
  - NecroAuraEmber
  - NecroAuraCorpse
  - NecroAuraAbyss

- type: entity
  abstract: true
  id: NecroAppearanceDummyBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite

# --- Forms: your ghost's shape and the body you get with Physical Form -----------------------------

- type: loadout
  id: NecroAppearanceAbomination
  dummyEntity: NecroAppearanceDummyAbomination

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyAbomination
  name: Abomination
  description: "Form: Slow and brutal. Very tough, hits hardest."
  components:
  - type: Sprite
    sprite: Mobs/Demons/abomination.rsi
    state: abomination
  - type: NecroAppearanceOption
    form: MobKandarianFormAbomination
    rsi: /Textures/Mobs/Demons/abomination.rsi
    state: abomination

- type: loadout
  id: NecroAppearanceHellspawn
  dummyEntity: NecroAppearanceDummyHellspawn

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyHellspawn
  name: Hellspawn
  description: "Form: Balanced speed, toughness and claws."
  components:
  - type: Sprite
    sprite: Mobs/Demons/hellspawn.rsi
    state: alive
  - type: NecroAppearanceOption
    form: MobKandarianFormHellspawn
    rsi: /Textures/Mobs/Demons/hellspawn.rsi
    state: alive

- type: loadout
  id: NecroAppearanceFlesh
  dummyEntity: NecroAppearanceDummyFlesh

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyFlesh
  name: Flesh Golem
  description: "Form: The toughest and slowest form. Crushing blows."
  components:
  - type: Sprite
    sprite: Mobs/Aliens/flesh.rsi
    state: golem
  - type: NecroAppearanceOption
    form: MobKandarianFormFlesh
    rsi: /Textures/Mobs/Aliens/flesh.rsi
    state: golem

- type: loadout
  id: NecroAppearanceWraith
  dummyEntity: NecroAppearanceDummyWraith

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyWraith
  name: Wraith
  description: "Form: The fastest form, with quick weak strikes. Fragile."
  components:
  - type: Sprite
    sprite: Mobs/Ghosts/revenant.rsi
    state: active
  - type: NecroAppearanceOption
    form: MobKandarianFormWraith
    rsi: /Textures/Mobs/Ghosts/revenant.rsi
    state: active

- type: loadout
  id: NecroAppearanceLover
  dummyEntity: NecroAppearanceDummyLover

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyLover
  name: Shambling Lover
  description: "Form: Sturdy and biting. A little tougher than a hellspawn."
  components:
  - type: Sprite
    sprite: Mobs/Aliens/flesh.rsi
    state: lover
  - type: NecroAppearanceOption
    form: MobKandarianFormLover
    rsi: /Textures/Mobs/Aliens/flesh.rsi
    state: lover

- type: loadout
  id: NecroAppearanceCrawler
  dummyEntity: NecroAppearanceDummyCrawler

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyCrawler
  name: Crawler
  description: "Form: Very fast and low to the ground. Fairly fragile."
  components:
  - type: Sprite
    sprite: Mobs/Aliens/Argocyte/argocyte_common.rsi
    state: crawler
  - type: NecroAppearanceOption
    form: MobKandarianFormCrawler
    rsi: /Textures/Mobs/Aliens/Argocyte/argocyte_common.rsi
    state: crawler

- type: loadout
  id: NecroAppearanceApparition
  dummyEntity: NecroAppearanceDummyApparition

- type: entity
  parent: NecroAppearanceDummyBase
  id: NecroAppearanceDummyApparition
  name: Apparition
  description: "Form: A drifting dead thing with a freezing touch. Quick, not tough."
  components:
