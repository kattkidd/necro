# Round-start Necronomicon antagonist (Evil Dead).
- type: entity
  parent: [ BaseGameRule, BaseRoundstartAntagRule ]
  id: Necronomicon
  components:
  - type: GameRule
    minPlayers: 15
  - type: NecronomiconRule
  - type: AntagSpawner
    prototype: MobKandarianDemon
  - type: AntagSelection
    antags:
    - !type:FixedAntagCount
      proto: Necronomicon
  - type: DynamicRuleCost
    cost: 200
